<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>x-reader 设置</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head>
<body>
  <header><img src="../../icons/logo.svg" width="32" height="32" alt=""><div><h1>x-reader<span>长文目录</span></h1></div><span class="version">v0.1.4</span></header>
  <main>
    <section class="current" aria-label="当前页面"><div class="eyebrow"><span class="status-dot"></span><span id="status-label">正在读取页面</span></div><h2 id="page-title">让长文更好读</h2><p id="page-detail">在 X 长文中，随时找到想读的章节。</p><div class="page-actions"><button id="toggle" class="primary" disabled>展开目录<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button></div></section>
    <form id="settings"><div class="section-label">阅读偏好</div>
      <label class="setting"><span><strong>启用 x-reader</strong><small>有标题时在页面右侧自动显示</small></span><input type="checkbox" name="enabled" role="switch"><span class="switch" aria-hidden="true"></span></label>
      <label class="setting"><span><strong>识别加粗小标题</strong><small>将独立成行的加粗文字加入目录</small></span><input type="checkbox" name="detectBold" role="switch"><span class="switch" aria-hidden="true"></span></label>
      <label class="setting"><span><strong>识别编号小标题</strong><small>兼容「1、章节」与「第一章」等写法</small></span><input type="checkbox" name="detectNumbered" role="switch"><span class="switch" aria-hidden="true"></span></label>
      <label class="setting theme-setting"><span><strong>目录外观</strong><small>选择舒适的阅读配色</small></span><select name="theme" aria-label="目录外观"><option value="auto">跟随页面</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
    <label class="setting"><span><strong>匿名使用统计</strong><small>默认关闭；仅统计扩展界面，不上传文章和网址</small></span><input id="hub-analytics" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span></label></form>
    <p id="notice" role="status" aria-live="polite"></p>
  </main>
  <footer><span>本地运行 · 无需账号配置</span><span>设置自动保存</span></footer>
</body>
</html>
